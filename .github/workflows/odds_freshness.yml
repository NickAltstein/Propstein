name: Odds Feed Freshness

on:
  schedule:
    # 15-min cadence (audit §d: ~24x redundancy inside the 6h TTL alarm;
    # GitHub demonstrably drops/delays scheduled ticks). Offset :7/:22/:37/:52
    # from news_watcher's :5/:35 to reduce queueing in the shared autopilot
    # concurrency group. NFL prices are the public Polymarket book. No paid
    # odds provider is called.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: odds-freshness-data
  cancel-in-progress: false

jobs:
  refresh-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install contract validator
        run: python -m pip install 'pydantic>=2,<3'

      - name: Refresh public Polymarket observations
        run: python scripts/fetch_polymarket_props.py

      - name: Check freshness and provenance
        run: python scripts/check_odds_freshness.py --max-age-hours 6

      - name: Flag degraded commercial slate day
        if: always()
        run: python scripts/record_commercial_health.py

      - name: Cache B1 line history database
        uses: actions/cache@v4
        with:
          path: data/line_history.db
          key: line-history-db-${{ github.run_id }}
          restore-keys: |
            line-history-db-

      - name: Ingest into B1 line history and export static lines
        run: python src/line_history.py --ingest-feed viewer/live_odds_feed.json --export-static

      - name: Publish passing snapshot via auto-merge PR
        env:
          GH_TOKEN: ${{ secrets.DATA_BOT_TOKEN }}
        run: |
          git add viewer/live_odds_feed.json viewer/live_odds_feed.manifest.json data/polymarket_receipt_log.json viewer/api/lines/
          if [ -f data/polymarket_line_collisions.json ]; then
            git add data/polymarket_line_collisions.json
          fi
          if [ -f viewer/feeds/feed_heartbeat.json ]; then
            git add viewer/feeds/feed_heartbeat.json
          fi
          bash scripts/open_automerge_data_pr.sh \
            "odds-freshness" \
            "chore(data): refresh Polymarket odds snapshot and B1 lines"

      - name: Publish degraded-day flag via auto-merge PR without failed feed data
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DATA_BOT_TOKEN }}
        run: |
          git add data/commercial_degraded_days.json
          bash scripts/open_automerge_data_pr.sh \
            "odds-freshness-degraded" \
            "chore(data): flag commercial feed degradation [vercel skip]"

      - name: Notify on failure (webhook)
        if: failure()
        env:
          ALARM_WEBHOOK_URL: ${{ secrets.ALARM_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${ALARM_WEBHOOK_URL:-}" ]; then
            echo "::error::ALARM_WEBHOOK_URL secret is not configured."
            exit 1
          fi
          MESSAGE="PropStein odds freshness alarm: feed stale (>6h), empty, or PR publish failed. ${RUN_URL}"
          python3 -c 'import json,sys; m=sys.argv[1]; print(json.dumps({"content": m, "text": m}))' "$MESSAGE" > payload.json
          curl -fsS -X POST "$ALARM_WEBHOOK_URL" -H 'Content-Type: application/json' --data @payload.json
