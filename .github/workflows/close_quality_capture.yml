name: Capture Close-Quality Liquidity (T-60/-30/-15/-5)

on:
  schedule:
    # Target every 10 minutes on odd minutes across 12:00-05:59 UTC.
    # GitHub schedule delivery is best-effort and cannot guarantee all four
    # target offsets. news_watcher.yml dispatches a separate ~30-minute
    # backstop when its self-handoff chain is healthy.
    - cron: '3,13,23,33,43,53 12-23,0-5 * * *'
  workflow_dispatch:

concurrency:
  group: close-quality-capture-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Run additive close-quality capture
        run: |
          PYTHONPATH=. python -m src.close_quality_capture

      - name: Open auto-merge PR only when new capture records exist
        env:
          GH_TOKEN: ${{ secrets.DATA_BOT_TOKEN }}
        run: |
          if [ ! -f data/close_quality_captures.jsonl ]; then
            echo "No close-quality captures yet — skipping PR."
            exit 0
          fi
          git add -N data/close_quality_captures.jsonl 2>/dev/null || true
          if git diff --quiet data/close_quality_captures.jsonl; then
            echo "No new close-quality capture records — skipping PR."
            exit 0
          fi
          git add data/close_quality_captures.jsonl data/close_quality_capture_status.json
          bash scripts/open_automerge_data_pr.sh \
            "close-quality-capture" \
            "chore(data): append close-quality captures [vercel skip]"

      - name: Notify on failure (webhook)
        if: failure()
        env:
          ALARM_WEBHOOK_URL: ${{ secrets.ALARM_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${ALARM_WEBHOOK_URL:-}" ]; then
            echo "::error::ALARM_WEBHOOK_URL secret is not configured."
            exit 1
          fi
          MESSAGE="PropStein close-quality capture FAILED. ${RUN_URL}"
          python3 -c 'import json,sys; m=sys.argv[1]; print(json.dumps({"content": m, "text": m}))' "$MESSAGE" > payload.json
          curl -fsS -o /dev/null -X POST "$ALARM_WEBHOOK_URL" -H 'Content-Type: application/json' --data @payload.json
