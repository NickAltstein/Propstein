name: Capture Close-Quality Liquidity (pre-game session, T-60 to T-8)

# One run stays up through each game's pre-game window and captures at
# T-60/-30/-15/-11/-8 on the runner's own clock (src/close_quality_session.py).
# The triggers below only have to start a session before the window; they
# no longer have to land on the right minute. GitHub's schedule drops most
# ticks, so the Vercel Schedules backstop (api/schedules, every 15 minutes)
# and the news-watcher chain dispatch this workflow too. Only the oldest
# active run on main leads (scripts/close_capture_leader.sh); the rest exit
# in seconds. Every round is logged per game in data/close_capture_log.jsonl;
# scripts/close_capture_coverage.py counts T-5 coverage from it.

on:
  schedule:
    - cron: '3,13,23,33,43,53 12-23,0-5 * * *'
  workflow_dispatch:
    inputs:
      handoff_from:
        description: 'Set by a session that hands over to this run. Leave empty.'
        type: string
        default: ''
      dry_run:
        description: 'Capture and log on this run only: no data PR, results uploaded as an artifact.'
        type: boolean
        default: false
      max_minutes:
        description: 'Session length cap in minutes (default 300).'
        type: string
        default: ''

# No concurrency group: a pending run would wait behind a session for hours.
# The leader step keeps it to one session instead.

permissions:
  contents: read
  actions: write        # leader check reads runs; a session dispatches its successor
  pull-requests: read   # wait for the session's previous data PR to merge

jobs:
  capture:
    runs-on: ubuntu-latest
    # Session cap 300 min + last data PR wait (25 min) + setup.
    timeout-minutes: 345
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Leave the window to an older session
        id: leader
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF_FROM: ${{ inputs.handoff_from }}
        run: bash scripts/close_capture_leader.sh

      - name: Run pre-game capture session
        if: inputs.dry_run == true || steps.leader.outputs.lead == 'true'
        env:
          DATA_BOT_TOKEN: ${{ secrets.DATA_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOSE_CAPTURE_PUBLISH: ${{ (github.ref == 'refs/heads/main' && inputs.dry_run != true) && '1' || '0' }}
          CLOSE_CAPTURE_MAX_MINUTES: ${{ inputs.max_minutes }}
        run: |
          PYTHONPATH=. python -m src.close_quality_session

      - name: Upload dry-run capture log
        if: always() && inputs.dry_run == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: close-capture-dry-run
          path: |
            data/close_capture_log.jsonl
            data/close_quality_captures.jsonl
            data/close_quality_capture_status.json
          if-no-files-found: warn

      - name: Notify on failure (webhook)
        if: failure()
        env:
          ALARM_WEBHOOK_URL: ${{ secrets.ALARM_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${ALARM_WEBHOOK_URL:-}" ]; then
            echo "::error::ALARM_WEBHOOK_URL secret is not configured."
            exit 1
          fi
          MESSAGE="PropStein close-quality capture FAILED. ${RUN_URL}"
          python3 -c 'import json,sys; m=sys.argv[1]; print(json.dumps({"content": m, "text": m}))' "$MESSAGE" > payload.json
          curl -fsS -o /dev/null -X POST "$ALARM_WEBHOOK_URL" -H 'Content-Type: application/json' --data @payload.json
