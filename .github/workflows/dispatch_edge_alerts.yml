name: Dispatch Verified Edge Alerts

concurrency:
  group: edge-alerts-watcher
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - "viewer/live_odds_feed.json"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      min_ev:
        description: "Minimum EV% threshold"
        required: false
        default: "5.0"

permissions:
  contents: read

jobs:
  disabled_notice:
    if: vars.PROPSTEIN_EDGES_URL == '' || vars.PROPSTEIN_PILOT_GAME_ID == '' || vars.PROPSTEIN_PILOT_PLAYER_ID == '' || vars.PROPSTEIN_PILOT_MARKET == '' || vars.PROPSTEIN_PILOT_BOOK == ''
    runs-on: ubuntu-latest
    steps:
      - name: Report disabled alert dispatch
        run: |
          echo "::notice::alert dispatch disabled: edge URL or one-market pilot scope unset"
          echo "alert dispatch disabled: edge URL or one-market pilot scope unset" >> "$GITHUB_STEP_SUMMARY"

  dispatch:
    if: vars.PROPSTEIN_EDGES_URL != '' && vars.PROPSTEIN_PILOT_GAME_ID != '' && vars.PROPSTEIN_PILOT_PLAYER_ID != '' && vars.PROPSTEIN_PILOT_MARKET != '' && vars.PROPSTEIN_PILOT_BOOK != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore SHA-256 sent alerts deduplication cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/sent_edge_alerts.json
            .cache/alert_pilot_dispatches.jsonl
          key: propstein-edge-alerts-${{ github.run_id }}
          restore-keys: |
            propstein-edge-alerts-

      - name: Run zero-dependency webhook dispatcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROPSTEIN_EDGES_URL: ${{ vars.PROPSTEIN_EDGES_URL }}
          PROPSTEIN_PILOT_GAME_ID: ${{ vars.PROPSTEIN_PILOT_GAME_ID }}
          PROPSTEIN_PILOT_PLAYER_ID: ${{ vars.PROPSTEIN_PILOT_PLAYER_ID }}
          PROPSTEIN_PILOT_MARKET: ${{ vars.PROPSTEIN_PILOT_MARKET }}
          PROPSTEIN_PILOT_BOOK: ${{ vars.PROPSTEIN_PILOT_BOOK }}
        run: |
          MIN_EV="${{ github.event.inputs.min_ev || '5.0' }}"
          python3 scripts/dispatch_edge_alerts.py \
            --min-ev "$MIN_EV"

      - name: Save updated SHA-256 sent alerts cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/sent_edge_alerts.json
            .cache/alert_pilot_dispatches.jsonl
          key: propstein-edge-alerts-${{ github.run_id }}

      - name: Preserve pilot dispatch records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alert-pilot-dispatches
          path: .cache/alert_pilot_dispatches.jsonl
          if-no-files-found: ignore
          retention-days: 30
