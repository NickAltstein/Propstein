name: Feed age watch

# Dead-man for the odds pollers. This workflow does not fetch Kalshi or
# Polymarket. It reads the last non-empty success those jobs recorded and
# pages if that timestamp is too old while a slate is still coming up.
# Disabling the poller does not disable this job.
#
# ALARM_WEBHOOK_URL  optional. POST {"content","text"} when a sport is
#                    degraded or critical. Unset means the red job is the alarm.
# FEED_AGE_UPTIME_URL optional. GET on every run, including a healthy one.
#                    An external monitor should page if that ping stops.

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feed-age-watch-data
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check feed age and open auto-merge PR if status changed
        env:
          ALARM_WEBHOOK_URL: ${{ secrets.ALARM_WEBHOOK_URL }}
          FEED_AGE_UPTIME_URL: ${{ secrets.FEED_AGE_UPTIME_URL }}
          GH_TOKEN: ${{ secrets.DATA_BOT_TOKEN }}
        run: |
          set +e
          python3 scripts/feed_age.py --check --status-out viewer/feeds/feed_status.json
          code=$?
          set -e
          git add viewer/feeds/feed_status.json
          DAY="$(date -u +%F)"
          bash scripts/open_automerge_data_pr.sh \
            "feed-age-watch" \
            "chore(data): feed age status ${DAY}"
          exit "$code"

      - name: Notify on failure (webhook)
        if: failure()
        env:
          ALARM_WEBHOOK_URL: ${{ secrets.ALARM_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${ALARM_WEBHOOK_URL:-}" ]; then
            echo "::error::ALARM_WEBHOOK_URL secret is not configured."
            exit 1
          fi
          MESSAGE="PropStein feed age watch FAILED. ${RUN_URL}"
          python3 -c 'import json,sys; m=sys.argv[1]; print(json.dumps({"content": m, "text": m}))' "$MESSAGE" > payload.json
          curl -fsS -X POST "$ALARM_WEBHOOK_URL" -H 'Content-Type: application/json' --data @payload.json
