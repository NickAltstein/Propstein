name: Poll NFL Availability and IR Events

on:
  schedule:
    # Midweek (Tue-Thu): every 6h on odd minute :19
    - cron: '19 2,8,14,20 * * 2-4'
    # Fri-Sun active injury/IR window: every 2h on odd minute :19
    - cron: '19 */2 * * 5,6,0'
    # Official-inactive / pre-kickoff windows (TNF, Sun early/late/SNF, MNF)
    - cron: '45 23 * * 4'
    - cron: '45 0 * * 5'
    - cron: '35 16 * * 0'
    - cron: '35 19 * * 0'
    - cron: '50 23 * * 0,1'
  workflow_dispatch:

concurrency:
  group: availability-poll-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install parquet dependency
        run: python -m pip install "pandas>=2,<3" "pyarrow>=15,<20"

      - name: Poll availability sources into append-only JSONL
        run: |
          PYTHONPATH=. python -m src.availability_producer --season 2026 --week 11

      - name: Open auto-merge PR only when new availability events exist
        env:
          GH_TOKEN: ${{ secrets.DATA_BOT_TOKEN }}
        run: |
          git add -N data/availability_events.jsonl 2>/dev/null || true
          if git diff --quiet data/availability_events.jsonl; then
            echo "No new availability events — skipping PR (no timestamp-only commits)."
            exit 0
          fi
          git add data/availability_events.jsonl viewer/availability_report.json
          bash scripts/open_automerge_data_pr.sh \
            "availability-poll" \
            "chore(data): append availability events"

      - name: Notify on failure (webhook)
        if: failure()
        env:
          ALARM_WEBHOOK_URL: ${{ secrets.ALARM_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${ALARM_WEBHOOK_URL:-}" ]; then
            echo "::error::ALARM_WEBHOOK_URL secret is not configured."
            exit 1
          fi
          MESSAGE="PropStein NFL availability poll FAILED. ${RUN_URL}"
          python3 -c 'import json,sys; m=sys.argv[1]; print(json.dumps({"content": m, "text": m}))' "$MESSAGE" > payload.json
          curl -fsS -o /dev/null -X POST "$ALARM_WEBHOOK_URL" -H 'Content-Type: application/json' --data @payload.json
