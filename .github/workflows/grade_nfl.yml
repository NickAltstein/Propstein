name: Grade NFL Week

# Settles every finished NFL slate against nflverse weekly stats and the last
# pre-kickoff market quote (scripts/grade_nfl_week.py --auto). nflverse posts
# Sunday/Monday stats by Tuesday morning; Wednesday retries a late release.
on:
  schedule:
    - cron: '0 15 * * 2'
    - cron: '0 15 * * 3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grade-nfl
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.DATA_BOT_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: pip install -r requirements.lock

      - name: Grade finished weeks
        run: PYTHONPATH=.:src python scripts/grade_nfl_week.py --auto

      - name: Render every newly settled NFL result and weekly summary
        run: |
          npm ci
          for source in $(git diff --name-only -- viewer/feeds/grades) $(git ls-files --others --exclude-standard -- viewer/feeds/grades); do
            case "$source" in
              viewer/feeds/grades/nfl_*.json)
                slate=$(basename "${source%.json}")
                node scripts/generate_audit_cards.mjs "$source" "viewer/share/grades/$slate"
                ;;
            esac
          done

      - name: Open auto-merge PR for grades (if any)
        env:
          GH_TOKEN: ${{ secrets.DATA_BOT_TOKEN }}
        run: |
          git add viewer/feeds/grades viewer/share/grades
          DAY="$(date -u +%F)"
          bash scripts/open_automerge_data_pr.sh \
            "bot/grade-nfl" \
            "chore(data): NFL weekly grades ${DAY}" \
            "chore(data): NFL weekly grades ${DAY}"
