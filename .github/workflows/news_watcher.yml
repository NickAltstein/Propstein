name: News Watcher Poll

# The news watcher is a one-shot poll here — scripts/news_watcher.py is a
# persistent-loop program by design, and no host runs that loop today. This
# workflow is the watcher's ONLY host: every 30 minutes it performs one real
# network poll of the upstream feed and commits the resulting heartbeat
# (last_polled_at) so the deployed terminal stops showing an abandoned feed.
#
# GitHub's schedule event is best-effort. Under load it delays ticks and
# drops some entirely (no run is created, so the Actions list stays empty).
# A run on main therefore re-dispatches itself when it finishes. The cron
# below is the cold start that gets the chain going again if a handoff is
# lost. The follow-up run waits until 30 minutes after the last COMMITTED
# heartbeat before it polls, so a dropped cron does not also become a tight
# loop.
#
# Honesty contract:
#   - The heartbeat timestamp is committed only when the fetch actually
#     succeeded (--fail-on-fetch-error makes the run red on upstream failure;
#     a failed run commits nothing, so the site keeps its last VERIFIED-good
#     heartbeat and the 24h feed-abandonment banner can still fire truthfully).
#   - The 300s dead-man switch (autonomous dispatch latch) is intentionally
#     NOT satisfied by this cadence. CADENCE_SECONDS stays 1800. Dispatch
#     stays suppressed until a real persistent watcher exists. Do not shrink
#     the wait to "fix" that.
#   - poll_now is fail-closed: only an explicit true skips the wait. A manual
#     Run workflow with the box unchecked still polls immediately when the
#     committed heartbeat is already older than 30 minutes.

on:
  schedule:
    # Off the documented high-load minutes (:00 and :30, and the old :05/:35
    # pair that sat on that pile-up). Changing the cron also re-registers the
    # schedule actor. Delivery is still best-effort; the handoff below is
    # what keeps the 30-minute gap when a tick is dropped.
    - cron: '11,41 * * * *'
  workflow_dispatch:
    inputs:
      poll_now:
        description: 'Poll even if the last committed heartbeat is younger than 30 minutes. Leave unchecked for a normal run.'
        type: boolean
        default: false

# Own group. The previous group, "autopilot", is shared with daily_update,
# odds_freshness, freeze_sunday_early, and freeze_ufc. cancel-in-progress
# false still keeps only one pending run per group, so a newer odds or
# autopilot tick cancels a news run that has not started yet. In-progress
# polls (including the cadence wait and the push) are never cancelled.
concurrency:
  group: news-watcher-data
  cancel-in-progress: false

jobs:
  poll-and-publish:
    runs-on: ubuntu-latest
    # 30-minute cadence wait, plus clone, poll, and PR creation.
    timeout-minutes: 45
    permissions:
      contents: read
      # GITHUB_TOKEN may create workflow_dispatch runs. Required for the handoff.
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Poll news watcher once
        run: |
          set -euo pipefail
          python scripts/news_watcher.py --once --fail-on-fetch-error

      - name: Open auto-merge PR for news watcher heartbeat (if changed)
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.DATA_BOT_TOKEN }}
        run: |
          git add data/news_watcher_state.json viewer/news_watcher_state.json public/news_watcher_state.json
          bash scripts/open_automerge_data_pr.sh \
            "news-watcher" \
            "chore(data): news watcher heartbeat [vercel skip]"

      # The close-quality workflow's 10-minute GitHub schedule lost nearly all
      # evening ticks on Nov 18. This independent, already-running 30-minute
      # dispatch chain gives it a backstop without a new paid scheduler or PAT.
      # It improves coverage; it does not certify T-15/T-5 capture.
      - name: Backstop close-quality capture
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for status in queued waiting requested pending in_progress; do
            count=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/close_quality_capture.yml/runs?status=${status}&per_page=1" --jq '.total_count // 0' || echo 0)
            if [ "$count" -gt 0 ]; then
              echo "Close-quality capture already ${status}; leaving it queued."
              exit 0
            fi
          done
          if gh workflow run close_quality_capture.yml --ref main; then
            echo "Dispatched close-quality backstop."
          else
            echo "::warning::Close-quality backstop dispatch failed; the 10-minute cron remains available."
          fi

      # Mirror the close-quality backstop for ladder_capture.yml so dropped or
      # delayed GitHub 10-minute cron slots still get ~30-minute coverage.
      - name: Backstop ladder capture
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for status in queued waiting requested pending in_progress; do
            count=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ladder_capture.yml/runs?status=${status}&per_page=1" --jq '.total_count // 0' || echo 0)
            if [ "$count" -gt 0 ]; then
              echo "Ladder capture already ${status}; leaving it queued."
              exit 0
            fi
          done
          last_at=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ladder_capture.yml/runs?per_page=1" --jq '.workflow_runs[0].created_at // ""' || echo "")
          if [ -n "$last_at" ]; then
            age_s=$(python3 -c '
          import datetime, sys
          ts = datetime.datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))
          print(int((datetime.datetime.now(datetime.timezone.utc) - ts).total_seconds()))
          ' "$last_at" 2>/dev/null || echo 999999)
            if [ "$age_s" -lt 900 ]; then
              echo "Ladder capture ran ${age_s}s ago (<900s); skipping backstop."
              exit 0
            fi
          fi
          if gh workflow run ladder_capture.yml --ref main; then
            echo "Dispatched ladder capture backstop."
          else
            echo "::warning::Ladder capture backstop dispatch failed; the 10-minute cron remains available."
          fi

      - name: Notify on failure (webhook)
        if: failure()
        env:
          ALARM_WEBHOOK_URL: ${{ secrets.ALARM_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${ALARM_WEBHOOK_URL:-}" ]; then
            echo "::error::ALARM_WEBHOOK_URL secret is not configured."
            exit 1
          fi
          MESSAGE="PropStein news watcher poll/publish FAILED. ${RUN_URL}"
          python3 -c 'import json,sys; m=sys.argv[1]; print(json.dumps({"content": m, "text": m}))' "$MESSAGE" > payload.json
          curl -fsS -X POST "$ALARM_WEBHOOK_URL" -H 'Content-Type: application/json' --data @payload.json
