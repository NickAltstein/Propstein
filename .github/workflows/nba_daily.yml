name: Daily NBA Kalshi Market Slate

on:
  schedule:
    # Noon Eastern in EDT and EST, on odd minutes. :00 and :30 pile up with
    # other GitHub schedules and those ticks get dropped. Delayed ticks still
    # run; the published-date guard skips a duplicate only when the file is
    # not a Kalshi slate.
    - cron: '7 16 * * *'
    - cron: '23 17 * * *'
    # Late-afternoon Eastern refreshes (before the earliest 7 pm ET tips).
    # Kalshi quotes tighten closer to tip-off, so a Kalshi slate refreshes
    # on every tick.
    - cron: '37 20 * * *'
    - cron: '53 22 * * *'
    # Pre-tip capture windows (15-30m prior to 19:00, 19:30, 20:00, 21:00, 22:00, 22:30 ET).
    - cron: '43 23 * * *'
    - cron: '17 0 * * *'
    - cron: '43 0 * * *'
    - cron: '43 1 * * *'
    - cron: '43 2 * * *'
    - cron: '13 3 * * *'
  workflow_dispatch:

# Keep NBA publishing independent from the NFL autopilot and news watcher.
concurrency:
  group: nba-daily-market-slate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check whether today's NBA slate is already published
        id: clock
        run: |
          NBA_DATE=$(TZ=America/New_York date +%F)
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
          elif python3 - "$NBA_DATE" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          day = sys.argv[1]
          odds_path = Path('viewer') / f'nba_odds_{day}.json'
          slate_path = Path('viewer') / f'nba_slate_{day}.json'
          games_path = Path('viewer') / f'nba_games_{day}.json'
          if not odds_path.is_file() or not slate_path.is_file():
              raise SystemExit(1)
          try:
              odds = json.loads(odds_path.read_text())
              observed = datetime.fromisoformat(odds['updated_at'].replace('Z', '+00:00'))
          except (OSError, ValueError, KeyError, TypeError):
              raise SystemExit(1)
          if odds.get('slate') != day or odds.get('total_quotes', 0) < 1:
              raise SystemExit(1)
          # If all scheduled games for today have already tipped off, skip duplicate runs
          if games_path.is_file():
              try:
                  games = json.loads(games_path.read_text())
                  now_utc = datetime.now(timezone.utc)
                  tips = [datetime.fromisoformat(g['tipoff_utc'].replace('Z', '+00:00')) for g in games if g.get('tipoff_utc')]
                  if tips and all(now_utc >= t for t in tips):
                      raise SystemExit(0)
              except (OSError, ValueError, KeyError, TypeError):
                  pass
          if odds.get('source') == 'kalshi':
              raise SystemExit(1)  # Kalshi quotes move; refresh on every tick
          raise SystemExit(0 if observed.astimezone(ZoneInfo('America/New_York')).date().isoformat() == day else 1)
          PY
          then
            echo 'NBA slate already published today; skipping duplicate scheduled run.'
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.clock.outputs.should_run == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install NBA contract dependency
        if: steps.clock.outputs.should_run == 'true'
        run: python -m pip install "pydantic>=2,<3"

      - name: Refresh today's NBA market slate
        if: steps.clock.outputs.should_run == 'true'
        run: |
          NBA_DATE=$(TZ=America/New_York date +%F)
          echo "Refreshing NBA market slate for $NBA_DATE Eastern from Kalshi"
          # Free, keyless Kalshi player-points lines plus the ESPN schedule.
          # Games with no two-sided quote exit non-zero so the next tick retries.
          PYTHONPATH=. python scripts/fetch_kalshi_nba.py --date "$NBA_DATE"
          if [ -f "viewer/nba_games_$NBA_DATE.json" ]; then
            python scripts/publish_nba_market_slate.py "$NBA_DATE"
          else
            echo "No NBA games scheduled for $NBA_DATE Eastern."
          fi

      - name: Open auto-merge PR for refreshed slate (if changed)
        if: steps.clock.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.DATA_BOT_TOKEN }}
        run: |
          git add viewer/feeds 'viewer/nba_*.json'
          DAY="$(date -u +%F)"
          bash scripts/open_automerge_data_pr.sh \
            "nba-daily" \
            "chore(data): NBA daily refresh ${DAY}"

      - name: Notify on failure (webhook)
        if: failure()
        env:
          ALARM_WEBHOOK_URL: ${{ secrets.ALARM_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${ALARM_WEBHOOK_URL:-}" ]; then
            echo "::error::ALARM_WEBHOOK_URL secret is not configured."
            exit 1
          fi
          MESSAGE="PropStein NBA slate refresh FAILED. ${RUN_URL}"
          python3 -c 'import json,sys; m=sys.argv[1]; print(json.dumps({"content": m, "text": m}))' "$MESSAGE" > payload.json
          curl -fsS -X POST "$ALARM_WEBHOOK_URL" -H 'Content-Type: application/json' --data @payload.json
