name: Production deploy gate

# Decides on every push to main whether production needs a deploy, and
# triggers it through a Vercel deploy hook (scripts/deploy_gate.py):
#   code/UI change  -> deploy now
#   data-only       -> deploy if the last production deploy is >= 60 min old
#   nothing served  -> skip
# Runs on every push. An hourly sweep (cron here; Vercel Schedules once
# PR 260 lands) deploys any served change the 60-min data throttle left
# behind, e.g. the last data merge of the night. Vercel Schedules sends
# the same sweep as workflow_dispatch with sweep=true. A missed sweep costs
# nothing: the next push or sweep catches up. It commits nothing, so it
# cannot trigger itself.
#
# While vercel.json still deploys main automatically, the gate only
# reports. Run it by hand with force=true to test the deploy hook.
#
# Credentials live in the `deploy-gate` GitHub Environment, which only
# main may use, so no other branch or workflow can read them. Never add a
# pull_request_target (or pull_request) trigger: the repo is public and
# fork PRs must never run with these secrets. Every action is pinned to a
# full commit SHA because this job holds VERCEL_API_TOKEN, the most
# powerful credential in the setup (a team token can edit Vercel env vars,
# including GITHUB_DISPATCH_TOKEN).
#
# Secrets (never printed; no `set -x` anywhere in this workflow):
#   VERCEL_DEPLOY_HOOK_URL  deploy hook for branch main; anyone holding it
#                           can trigger a production deploy
#   VERCEL_API_TOKEN        reads deployments; creates one if the hook fails twice
#   ALARM_WEBHOOK_URL       pages unless the deploy reaches READY (or Vercel skips
#                           a build of the commit production already serves)
#
# Pushes whose head commit says [skip ci] do not run this workflow; the next
# push diffs against the last deployed commit, so nothing is lost.

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Call the deploy hook regardless of what changed (tests the hook)'
        required: false
        type: boolean
        default: false
      sweep:
        description: 'Hourly catch-up: deploy any served change the data throttle left behind (Vercel Schedules sends this)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deploy-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    # Two hook attempts (3 min each) + up to 10 min waiting for READY.
    timeout-minutes: 20
    environment: deploy-gate
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide and deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          ALARM_WEBHOOK_URL: ${{ secrets.ALARM_WEBHOOK_URL }}
          VERCEL_PROJECT_ID: prj_x5jE5FpSwubky56ZNjFY5nksEPNt
          VERCEL_TEAM_ID: team_x9wKpIlonQbu4ppHYWJ4mobH
          VERCEL_PROJECT_NAME: propstein
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          EVENT: ${{ github.event_name }}
          SWEEP: ${{ github.event_name == 'workflow_dispatch' && inputs.sweep }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python3 scripts/deploy_gate.py --force
          elif [ "$EVENT" = "schedule" ] || [ "$SWEEP" = "true" ]; then
            python3 scripts/deploy_gate.py --sweep
          else
            python3 scripts/deploy_gate.py
          fi
