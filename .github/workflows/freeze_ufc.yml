name: UFC Fight-Week Snapshots

# Three fixed closing points per fight (research/ufc-gate1 §D), fail-closed:
#   pre  : Friday 13:00 UTC, before the official weigh-ins
#   post : Friday 22:00 UTC, after weigh-ins (missed weight / scratches settled)
#   lock : every 30 min on fight day; snapshots only fights whose first bell is
#          within 60 min and not yet locked. No such fight -> no API call.
#   grade: Sunday 14:00 UTC, results from ESPN -> viewer/ufc_ledger.json
# A captured point is never overwritten or backfilled. Each odds pull is one
# request (h2h + totals, region us) = 2 credits; budget guard caps at 4.

on:
  schedule:
    - cron: '0 13 * * 5'
    - cron: '0 22 * * 5'
    - cron: '*/30 12-23 * * 6'
    - cron: '*/30 0-5 * * 0'
    - cron: '0 14 * * 0'
  workflow_dispatch:
    inputs:
      phase:
        description: 'pre | post | lock | grade | card (no snapshot)'
        required: true
        default: card

concurrency:
  group: freeze-ufc-data
  cancel-in-progress: false

jobs:
  ufc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Resolve phase
        id: phase
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT: ${{ github.event.inputs.phase }}
        run: |
          case "$SCHEDULE" in
            '0 13 * * 5') P=pre ;;
            '0 22 * * 5') P=post ;;
            '0 14 * * 0') P=grade ;;
            '') P="${INPUT:-card}" ;;
            *) P=lock ;;
          esac
          echo "phase=$P" >> "$GITHUB_OUTPUT"
          echo "UFC phase: $P"

      - name: Run UFC pipeline
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
        run: |
          case "$PHASE" in
            grade) python scripts/fetch_ufc_odds.py --grade ;;
            card)  python scripts/fetch_ufc_odds.py --no-odds ;;
            pre|post|lock) python scripts/fetch_ufc_odds.py --no-odds --snapshot "$PHASE" ;;
            *) echo "unknown phase $PHASE"; exit 2 ;;
          esac

      - name: Open auto-merge PR for UFC data (if changed)
        env:
          GH_TOKEN: ${{ secrets.DATA_BOT_TOKEN }}
        run: |
          git add viewer/ufc_*.json
          bash scripts/open_automerge_data_pr.sh \
            "freeze-ufc" \
            "chore(ufc): ${{ steps.phase.outputs.phase }} $(date -u +%FT%H:%MZ)"

      - name: Notify on failure (webhook)
        if: failure()
        env:
          ALARM_WEBHOOK_URL: ${{ secrets.ALARM_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${ALARM_WEBHOOK_URL:-}" ]; then
            echo "::error::ALARM_WEBHOOK_URL secret is not configured."
            exit 1
          fi
          MESSAGE="PropStein UFC fight-week snapshot FAILED. ${RUN_URL}"
          python3 -c 'import json,sys; m=sys.argv[1]; print(json.dumps({"content": m, "text": m}))' "$MESSAGE" > payload.json
          curl -fsS -o /dev/null -X POST "$ALARM_WEBHOOK_URL" -H 'Content-Type: application/json' --data @payload.json
