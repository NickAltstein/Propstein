name: Data Health

# One daily report across every feed a user sees. NBA prices are Kalshi and
# NFL prices are Polymarket. Per-job alarms only check their own output, so a
# stalled publish can otherwise go unnoticed. Read-only: never edits data.
on:
  schedule:
    # 18:30 UTC: after the noon-Eastern NBA slate job (16:00/17:00 UTC) has had
    # its two attempts, so a failed NBA day is reported the same day.
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      force_fail_alert_test:
        description: 'Deliberately fail the check to verify ALARM_WEBHOOK_URL alert delivery'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: data-health
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Check published feeds
        id: health
        run: |
          set -o pipefail
          python scripts/check_data_health.py --summary "$GITHUB_STEP_SUMMARY" | tee health.md

      - name: Check NFL game-context pricing provenance
        run: |
          if [ "${{ inputs.force_fail_alert_test }}" = "true" ]; then
            echo "Deliberate alert-path test failure (force_fail_alert_test=true)."
            exit 1
          fi
          PYTHONPATH=. python scripts/check_game_context_provenance.py

      - name: Check for stale data-bot PRs (1h frequent / 6h daily)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import re
          import subprocess
          import sys
          from datetime import datetime, timezone

          FREQUENT_WORKFLOWS = {
              "odds-freshness",
              "odds-freshness-degraded",
              "close-quality-capture",
              "news-watcher",
              "feed-age-watch",
          }

          raw = subprocess.check_output(
              ["gh", "pr", "list", "--label", "data-bot", "--state", "open",
               "--json", "number,title,createdAt,url", "--limit", "50"],
              text=True,
          )
          prs = json.loads(raw or "[]")
          now = datetime.now(timezone.utc)
          stale = []
          for pr in prs:
              created = datetime.fromisoformat(pr["createdAt"].replace("Z", "+00:00"))
              age_h = (now - created).total_seconds() / 3600.0
              m = re.match(r"^data\(([^)]+)\):", pr.get("title") or "")
              wf = m.group(1) if m else ""
              limit_h = 1.0 if wf in FREQUENT_WORKFLOWS else 6.0
              if age_h > limit_h:
                  stale.append((pr["number"], pr["title"], pr["url"], round(age_h, 2), limit_h))
          if stale:
              print("STALE data-bot PRs past threshold (not auto-closed; human review required):", file=sys.stderr)
              for num, title, url, age_h, limit_h in stale:
                  print(f"  - #{num} ({age_h}h > {limit_h}h): {title} — {url}", file=sys.stderr)
              sys.exit(1)
          print(f"No stale data-bot PRs ({len(prs)} open within threshold).")
          PY

      - name: Notify on failure (webhook)
        if: failure()
        env:
          ALARM_WEBHOOK_URL: ${{ secrets.ALARM_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${ALARM_WEBHOOK_URL:-}" ]; then
            echo "::error::ALARM_WEBHOOK_URL secret is not configured — failure alert could not be sent."
            exit 1
          fi
          FAILS=$(grep -o '`[a-z_]*` | ❌' health.md 2>/dev/null | cut -d'`' -f2 | paste -sd, - || true)
          MESSAGE="PropStein data health FAILED: ${FAILS:-see run}. ${RUN_URL}"
          python3 -c 'import json,sys; m=sys.argv[1]; print(json.dumps({"content": m, "text": m}))' "$MESSAGE" > payload.json
          curl -fsS -X POST "$ALARM_WEBHOOK_URL" -H 'Content-Type: application/json' --data @payload.json
