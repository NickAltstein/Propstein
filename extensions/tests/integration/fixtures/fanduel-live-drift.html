<!doctype html>
<!-- Representative FanDuel LIVE-STYLE fixture: role="button" aria-label Over/Under buttons + header matchup (no data-event-id) -->
<html lang="en">
<body>
  <main>
    <header><h1>DAL @ BOS</h1></header>
    <div data-testid="market-group">
      <h2>Player Points</h2>
      <ul>
        <li class="market-row">
          <span class="participant-name">Luka Dončić</span>
          <div role="button" aria-label="Luka Dončić - Over 31.5 Points, -112 Odds">
            <span>O 31.5</span>
            <span>-112</span>
          </div>
          <div role="button" aria-label="Luka Dončić - Under 31.5 Points, -108 Odds">
            <span>U 31.5</span>
            <span>-108</span>
          </div>
        </li>
      </ul>
    </div>
  </main>
</body>
</html>
